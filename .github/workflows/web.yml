# The web app: the engine compiled to WebAssembly, tested, and published to GitHub Pages from master.
name: web

on:
  push:
    branches: [master, web-app]
    paths: ["web/**", "src/qalc/shim.cpp", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  EMSDK_VERSION: "4.0.10"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Logic tests
        run: node --test web/test/logic.test.mjs
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y gettext pkg-config
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
      - name: Compiled libraries
        uses: actions/cache/restore@v4
        with:
          path: web/engine/.build/prefix
          key: wasm-libs-1-${{ env.EMSDK_VERSION }}-${{ github.run_id }}
          restore-keys: wasm-libs-1-${{ env.EMSDK_VERSION }}-
      - name: Engine
        run: bash web/engine/build.sh
      # what got built is kept even when a later step fails; the 1 in the key forces a full rebuild
      - name: Keep compiled libraries
        if: always()
        uses: actions/cache/save@v4
        with:
          path: web/engine/.build/prefix
          key: wasm-libs-1-${{ env.EMSDK_VERSION }}-${{ github.run_id }}
      - name: Engine test
        run: node web/test/engine.smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: engine
          path: web/app/engine/
      - name: Package
        run: node web/engine/package.mjs
      - name: Browser
        working-directory: web
        run: npm install --no-save --no-audit --no-fund playwright@1.56 && npx playwright install --with-deps chromium
      - name: The site in a browser, online and offline
        working-directory: web
        run: node test/e2e.mjs
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: web/shots/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
    outputs:
      url: ${{ steps.deploy.outputs.page_url }}

  # the same test against the real address: GitHub's hosting, HTTPS, its file types, the service worker there
  published:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser
        working-directory: web
        run: npm install --no-save --no-audit --no-fund playwright@1.56 && npx playwright install --with-deps chromium
      - name: The published site, online and offline
        working-directory: web
        env:
          SITE_URL: ${{ needs.deploy.outputs.url }}
        run: sleep 30 && node test/e2e.mjs
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-screenshots
          path: web/shots/
          if-no-files-found: ignore
