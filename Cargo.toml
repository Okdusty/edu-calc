[package]
name = "qcalcp"
version = "0.1.0-beta.1"
edition = "2024"
description = "Calculator, Octave-style interpreter and plotter: GTK 4, terminal UI and command line"
license = "GPL-2.0-or-later" # links libqalculate (GPL-2.0-or-later)
repository = "https://github.com/Okdusty/qcalcp"

[[bin]]
name = "EduCalc"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.11.5", features = ["v4_12"] }
plotters = "0.3.7"
pyo3 = { version = "0.29", features = ["auto-initialize"] }
ratatui = "0.30"
nalgebra = "0.35"
calamine = "0.36" # xlsx/xls/ods reading (readmatrix, data editor)

# deps fast + small, our crate keeps debug info
[profile.dev.package."*"]
opt-level = 2
debug = false

[build-dependencies]
cc = "1"

[profile.release]
strip = true
